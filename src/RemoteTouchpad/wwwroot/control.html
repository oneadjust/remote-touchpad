<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Remote Touchpad</title>
  <link rel="stylesheet" href="/styles.css?v=20260604-7">
</head>
<body>
  <main class="app">
    <section id="controller" class="controller">
      <div class="status">
        <strong>Remote Touchpad</strong>
        <span id="connectionState">Connecting</span>
      </div>
      <div id="pad" class="pad" aria-label="Touchpad"></div>
      <div class="buttons">
        <button id="leftButton" type="button">Left</button>
        <button id="rightButton" type="button">Right</button>
      </div>
    </section>
  </main>
  <script src="/control.js?v=20260604-7"></script>
</body>
</html>
